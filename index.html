<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Per te</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #1f1f1f;
      font-family: "Georgia", "Times New Roman", serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    #frase {
      display: none;
      max-width: 560px;
      font-size: clamp(1.35rem, 5vw, 2rem);
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #foto {
      display: none;
      max-width: 100%;
      max-height: 88dvh;
      border-radius: 12px;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .visibile {
      opacity: 1 !important;
    }
  </style>
</head>
<body>
  <p id="frase"></p>
  <img id="foto" src="" alt="Per te">

  <script>
    // 1. Le tue frasi (ricorda sempre virgolette doppie e virgola finale)
    const frasi = [
      "Sei la parte migliore della mia giornata.",
      "Anche oggi mi fai sorridere senza fare niente.",
      "Grazie perché con te tutto è più leggero.",
      "Ricordati che sei incredibile, anche nei giorni no.",
      "Non vedo l'ora di rivederti.",
      "TI AMO MILLE.",
      "MILLE BASIII.",
      "IKO TI AMA UN BOTTO",
    ];

    // 2. I nomi esatti delle foto caricate su GitHub
    const foto = [
      "foto1.jpg",
      "foto2.jpg",
    ];

    function scegliIndiceCasuale(lunghezza, chiaveStorage) {
      const ultimo = Number(localStorage.getItem(chiaveStorage));
      let indice;
      do {
        indice = Math.floor(Math.random() * lunghezza);
      } while (lunghezza > 1 && indice === ultimo);
      localStorage.setItem(chiaveStorage, indice);
      return indice;
    }

    function mostraContenutoAlternato() {
      const ultimoTipo = localStorage.getItem("ultimoTipo");

      // Se l'ultima volta è uscita una frase (e ci sono foto disponibili), mostra una foto
      if (ultimoTipo === "frase" && foto.length > 0) {
        const img = document.getElementById("foto");
        const indice = scegliIndiceCasuale(foto.length, "ultimaFoto");
        img.src = foto[indice];
        img.style.display = "block";
        img.onload = () => img.classList.add("visibile");
        localStorage.setItem("ultimoTipo", "foto");
      } else {
        // Altrimenti (inclusa la primissima apertura) mostra una frase
        const testo = document.getElementById("frase");
        const indice = scegliIndiceCasuale(frasi.length, "ultimaFrase");
        testo.textContent = frasi[indice];
        testo.style.display = "block";
        requestAnimationFrame(() => testo.classList.add("visibile"));
        localStorage.setItem("ultimoTipo", "frase");
      }
    }

    mostraContenutoAlternato();
  </script>
</body>
</html>
